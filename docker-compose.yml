services:
  db:
    image: postgres:16-alpine
    container_name: deron_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: drone_db
    ports:
      - "5432:5432"
    volumes:
      - deron_postgres_data:/var/lib/postgresql/data

  permissions_app:
    build:
      context: ./permissions_app
    container_name: deron_permissions_app
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/drone_db
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./permissions_app:/app

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: deron_keycloak
    restart: always
    command: start-dev --features=organization
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/drone_db
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgrespassword
    ports:
      - "8180:8080"
    depends_on:
      - db

  bff_app:
    build:
      context: ./bff_app
    container_name: deron_bff_app
    restart: always
    environment:
      - FRONTEND_URL=http://localhost:8080
      - BFF_PUBLIC_URL=http://localhost:8001
      - KEYCLOAK_SERVER_URL=http://localhost:8180
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=deron-realm
      - KEYCLOAK_CLIENT_ID=deron-bff
      - KEYCLOAK_CLIENT_SECRET=fJb1U33GTJQ5OQGRlyHKXK9uy4u8bpFR4SNqxCD3utP5nxPKPxHUHqpu6g1rV5yX30O1EjXRJIdCpUhuIfysIo
      - SESSION_SECRET_KEY=dev-bff-session-secret-replace-in-production-k7x9m2
      - PERMISSIONS_API_URL=http://permissions_app:8000
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/drone_db
    ports:
      - "8001:8001"
    volumes:
      - ./bff_app:/app
    depends_on:
      - keycloak
      - permissions_app

volumes:
  deron_postgres_data:
