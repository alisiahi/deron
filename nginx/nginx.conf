# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name rlab-drone-establish.egov.uni-koblenz.de localhost;

    # Allow ACME challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name rlab-drone-establish.egov.uni-koblenz.de;

    # SSL Certificates (issued by Let's Encrypt Certbot or OpenSSL self-signed)
    ssl_certificate /etc/letsencrypt/live/rlab-drone-establish.egov.uni-koblenz.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rlab-drone-establish.egov.uni-koblenz.de/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Flutter Web Static Files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # BFF Auth Routes
    location /auth/ {
        proxy_pass http://bff_app:8001/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # BFF API Gateway Routes
    location /api/ {
        proxy_pass http://bff_app:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Keycloak Endpoint
    location /kc/ {
        proxy_pass http://keycloak:8080/kc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
